<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corazón</title>
<style>
  #msg {
  position: fixed; left: 0; right: 0;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  text-align: center; padding: 0 16px;
  font: italic 28px Georgia, "Times New Roman", serif;
  color: #fff; letter-spacing: 2px;
  text-shadow: 0 0 8px #ff4fd8, 0 0 20px #7a5cff, 0 0 40px #00d4ff;
  opacity: 0; transform: translateY(12px);
  transition: opacity 2s ease, transform 2s ease;
  pointer-events: none;
}
#msg.show { opacity: 1; transform: translateY(0); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  button { position: fixed; right: 12px; bottom: 12px;
    background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px 16px; font: 16px sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Para ti Sara, con mucho amor y cariño ✿</div>
<button id="r">Repetir</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let segs = [], drawn = 0, raf;

function hsv(h, s, v) {
  h = h % 1; const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  const [r, g, b] = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i % 6];
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

function build() {
  segs = [];
  let x = 0, y = 0, a = 0, h = 0, col = '#fff';
  const rt = d => a -= d, lt = d => a += d;
  function circle(r, ext) {
    const n = 30, rad = Math.PI / 180;
    const cx = x + r * Math.cos((a + 90) * rad), cy = y + r * Math.sin((a + 90) * rad);
    let px = x, py = y;
    for (let k = 1; k <= n; k++) {
      const ang = (a - 90 + ext * k / n) * rad;
      const nx = cx + r * Math.cos(ang), ny = cy + r * Math.sin(ang);
      segs.push([px, py, nx, ny, col]);
      px = nx; py = ny;
    }
    x = px; y = py; a += ext;
  }
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 18; j++) {
      col = hsv(h, 0.9, 1); h += 0.005;
      rt(90); circle(150 - j * 6, 90);
      lt(90); circle(150 - j * 6, 90);
      rt(180);
    }
    rt(360 / 16);
  }
}

function setup() {
  const d = window.devicePixelRatio || 1;
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = Math.min(cv.width, cv.height) / 640;
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.scale(s, -s);
  ctx.lineWidth = 1.5; ctx.lineCap = 'round';
}

function paint(from, to) {
  for (let i = from; i < to; i++) {
    const s = segs[i];
    ctx.strokeStyle = s[4];
    ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
  }
}


build();
const msg = document.getElementById('msg');

function start() {
  cancelAnimationFrame(raf);
  msg.classList.remove('show');
  setup(); drawn = 0;
  (function step() {
    const next = Math.min(drawn + 20, segs.length);
    paint(drawn, next); drawn = next;
    if (drawn < segs.length) raf = requestAnimationFrame(step);
    else msg.classList.add('show');
  })();
}
start();
document.getElementById('r').onclick = start;
addEventListener('resize', () => { cancelAnimationFrame(raf); setup(); paint(0, drawn); });
</script>
</body>
</html>
